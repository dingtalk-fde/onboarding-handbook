name: Post-deploy verification

# Manual (or deployment_status-triggered) run of the same health/sync check the Railway cron job runs.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r healthcheck/requirements.txt
      - name: Health + MCP + sync check against the public endpoint
        env:
          MCP_URL: https://onboarding-kb-mcp-production.up.railway.app
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python healthcheck/check.py
