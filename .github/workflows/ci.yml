name: CI

# Runs tests on every PR and push to main. Railway's GitHub autodeploy is configured with
# "Wait for CI": a push to main is only deployed after this workflow succeeds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + MCP smoke tests (offline; live LLM tests skip without a key)
        run: python -m pytest -v
      - name: Healthcheck script compiles
        run: python -m py_compile ../healthcheck/check.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MCP image
        run: docker build -t kb-mcp .
      - name: Build healthcheck image
        run: docker build -f healthcheck/Dockerfile -t kb-healthcheck .
      - name: Container smoke test
        run: |
          docker run -d --name kb -p 8000:8000 -e KB_COMMIT=${{ github.sha }} kb-mcp
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          docker run --rm --network host -e MCP_URL=http://localhost:8000 \
            -e GITHUB_REPO=${{ github.repository }} -e SYNC_GRACE_MINUTES=100000 kb-healthcheck
